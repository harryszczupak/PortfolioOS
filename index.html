function gen(){
 const W=1536,H=768,CW=1024,CH=512;
 const h3=(i,j,k)=>{let n=Math.imul(i,374761393)^Math.imul(j,668265263)^Math.imul(k,1274126177);n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967295};
 const sm=t=>t*t*(3-2*t);
 const vn=(x,y,z)=>{const i=Math.floor(x),j=Math.floor(y),k=Math.floor(z),u=sm(x-i),v=sm(y-j),w=sm(z-k);
  const a=h3(i,j,k),b=h3(i+1,j,k),c=h3(i,j+1,k),d=h3(i+1,j+1,k),e=h3(i,j,k+1),f=h3(i+1,j,k+1),g=h3(i,j+1,k+1),q=h3(i+1,j+1,k+1);
  const p1=a+(b-a)*u,p2=c+(d-c)*u,p3=e+(f-e)*u,p4=g+(q-g)*u,r1=p1+(p2-p1)*v,r2=p3+(p4-p3)*v;return r1+(r2-r1)*w};
 const fbm=(x,y,z,o)=>{let s=0,a=.5,n=0;for(let q=0;q<o;q++){s+=a*vn(x,y,z);n+=a;x*=2.03;y*=2.03;z*=2.03;a*=.5}return s/n};
 const st=(a,b,v)=>{const t=Math.min(1,Math.max(0,(v-a)/(b-a)));return t*t*(3-2*t)};
 const mx=(c1,c2,t)=>[c1[0]+(c2[0]-c1[0])*t,c1[1]+(c2[1]-c1[1])*t,c1[2]+(c2[2]-c1[2])*t];
 const mkc=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');return[c,x,x.createImageData(w,h)]};
 const [cA,xA,iA]=mkc(W,H),[cB,xB,iB]=mkc(W,H),[cS,xS,iS]=mkc(W,H),[cC,xC,iC]=mkc(CW,CH);
 const deep=[5,20,58],shal=[30,125,165],grass=[86,134,58],forest=[26,90,46],desert=[198,170,110],tundra=[118,126,108],rock=[112,102,92],snowc=[244,247,250],sand=[216,202,154];
 const SEA=.535;
 for(let py=0;py<H;py++)for(let px=0;px<W;px++){
  const lo=px/W*6.2832,la=(.5-py/H)*3.1416,cl=Math.cos(la),X=cl*Math.cos(lo),Y=Math.sin(la),Z=cl*Math.sin(lo),ay=Math.abs(Y);
  const hg=fbm(X*1.7+5,Y*1.7+5,Z*1.7+5,6),o=(py*W+px)*4;let c,bump,spec;

  else{const e=(hg-SEA)/.25,m=fbm(X*2.6+20,Y*2.6,Z*2.6-9,4),tp=1-Math.pow(ay,1.4)-e*.3;
   c=mx(grass,forest,st(.45,.65,m));
   c=mx(c,desert,st(.5,.38,m)*st(.3,.5,tp));
   c=mx(c,tundra,st(.4,.25,tp));
   c=mx(c,rock,st(.3,.5,e));
   const sn=Math.max(st(.6,.8,e),st(.8,.9,ay),st(.18,.08,tp));
   c=mx(c,sand,(1-st(0,.05,e))*(1-sn));c=mx(c,snowc,sn);
   const dt=.86+.28*vn(X*45,Y*45,Z*45);c=[c[0]*dt,c[1]*dt,c[2]*dt];
   bump=60+Math.min(1,e)*195;spec=sn>.5?70:22}
  iA.data[o]=c[0];iA.data[o+1]=c[1];iA.data[o+2]=c[2];iA.data[o+3]=255;
  iB.data[o]=iB.data[o+1]=iB.data[o+2]=bump;iB.data[o+3]=255;
  iS.data[o]=iS.data[o+1]=iS.data[o+2]=spec;iS.data[o+3]=255}
 for(let py=0;py<CH;py++)for(let px=0;px<CW;px++){
  const lo=px/CW*6.2832,la=(.5-py/CH)*3.1416,cl=Math.cos(la),v=fbm(cl*Math.cos(lo)*2.4+50,Math.sin(la)*2.4+50,cl*Math.sin(lo)*2.4+50,5),o=(py*CW+px)*4;
  iC.data[o]=iC.data[o+1]=iC.data[o+2]=255;iC.data[o+3]=st(.5,.74,v)*215}

});

M.forEach((m,i)=>{const a=m.v,b=M[(i+1)%M.length].v,w=Math.acos(Math.min(1,a.dot(b))),pts=[];
 for(let k=0;k<=32;k++){const t=k/32,p=a.clone().multiplyScalar(Math.sin((1-t)*w)).add(b.clone().multiplyScalar(Math.sin(t*w))).divideScalar(Math.sin(w));pts.push(p.multiplyScalar(1.012+.05*Math.sin(Math.PI*t)))}

R.domElement.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,e);moved=0;R.domElement.setPointerCapture(e.pointerId);if(ptrs.size===2){const [a,b]=[...ptrs.values()];pd=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}});
